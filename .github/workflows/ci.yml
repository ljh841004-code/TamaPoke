name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Compile firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      # Fijado a la version del core verificada para compilar este sketch. Subirla
      # a mano y a proposito: alguna version nueva del core ha roto librerias de
      # terceros antes.
      - name: Install ESP32 core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Install libraries
        run: arduino-cli lib install "GFX Library for Arduino@1.6.8" "SensorLib@0.5.0" "XPowersLib@0.3.3" "U8g2@2.36.19"

      - name: Compile
        run: >
          arduino-cli compile --warnings=all --export-binaries
          --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          .

      - name: Build USB installer image
        run: |
          python3 -m pip install esptool
          python3 -m esptool --chip esp32s3 merge-bin -o tamapoke-v1.19.bin \
            0x0 build/esp32.esp32.esp32s3/TamaPoke.ino.bootloader.bin \
            0x8000 build/esp32.esp32.esp32s3/TamaPoke.ino.partitions.bin \
            0xe000 build/esp32.esp32.esp32s3/boot_app0.bin \
            0x10000 build/esp32.esp32.esp32s3/TamaPoke.ino.bin

      - name: Save USB installer image
        uses: actions/upload-artifact@v4
        with:
          name: tamapoke-v1.19-esp32s3
          path: |
            tamapoke-v1.19.bin
            build/esp32.esp32.esp32s3/TamaPoke.ino.bin
          if-no-files-found: error
  generated:
    name: Generated headers up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow

      - name: Regenerate dex.h and species.h
        run: |
          python3 tools/gen_dex.py
          python3 tools/sprites.py emit

      # dex.h y species.h llevan "GENERADO - no editar" en su cabecera; esto pilla
      # a quien edite la salida en vez del generador, o se olvide de regenerar
      # tras tocar los datos de origen.
      - name: Fail if regenerating produced a diff
        run: git diff --exit-code -- dex.h species.h

  tools-lint:
    name: Lint tools/ (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install ruff
      - run: ruff check tools/

  tests:
    name: Game-logic tests (host, no board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # pet.cpp / i18n.cpp / dex.h compilan y corren en el PC contra unos shims
      # de Arduino, con millis() y random() falsos y una NVS en memoria. Aqui es
      # donde se han roto las cosas: los tres bugs de la v1.3, v1.4 y v1.8 eran
      # logica pura y estos tests los pillan sin tocar la placa.
      - name: Run the suite (plus AddressSanitizer + UBSan)
        run: ./test/run_tests.sh --asan

  i18n:
    name: i18n format-specifier consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/test_i18n_formats.py
